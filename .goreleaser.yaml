# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: passgen

before:
  hooks:
    - go mod tidy

builds:
  - id: passgen
    main: ./main.go
    binary: passgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/jtprogru/passgen/cmd.Version={{.Version}}
      - -X github.com/jtprogru/passgen/cmd.Commit={{.Commit}}
      - -X github.com/jtprogru/passgen/cmd.Date={{.Date}}
      - -X github.com/jtprogru/passgen/cmd.BuiltBy=goreleaser

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: jtprogru
    name: jtgpwgen
  draft: false
  prerelease: auto

brews:
  - name: passgen
    repository:
      owner: jtprogru
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/jtprogru/jtgpwgen"
    description: "Password generator with configurable character classes and memorable mode"
    license: "MIT"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(passgen): bring formula to {{ .Tag }}"
    install: |
      bin.install "passgen"
    test: |
      assert_match "passgen", shell_output("#{bin}/passgen --help")
